<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Phasmocademy Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    body {
      background-color: #050608;
      color: #f8f9fa;
    }
    .sidebar {
      min-height: 100vh;
      background: #0b0d12;
      border-right: 1px solid rgba(255,255,255,0.05);
    }
    .sidebar .nav-link {
      color: #aeb4c4;
      border-radius: 0.75rem;
      margin-bottom: 0.25rem;
      font-weight: 500;
    }
    .sidebar .nav-link.active,
    .sidebar .nav-link:hover {
      color: #fff;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
    }
    .brand-pill {
      border-radius: 999px;
      background: rgba(255,255,255,0.03);
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
    }
    .card-panel {
      background: #10121a;
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 1.25rem;
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row flex-nowrap">
    <!-- Sidebar -->
    <aside class="col-12 col-md-3 col-lg-2 sidebar d-flex flex-column p-3">
      <div class="d-flex align-items-center mb-4">
        <div class="rounded-circle d-flex align-items-center justify-content-center me-3"
             style="width:40px;height:40px;background:rgba(0,198,255,0.1);">
          <span class="fw-bold" style="font-size: 1.1rem;">P</span>
        </div>
        <div>
          <div class="fw-semibold">Phasmocademy</div>
          <div class="text-muted small">Inactivity & AFK assistant</div>
        </div>
      </div>

      <div class="brand-pill mb-3">
        <span class="text-success">●</span> Bot online (local)
      </div>

      <nav class="nav nav-pills flex-column mb-auto">
        <a
          href="{% url 'dashboard:overview' %}"
          class="nav-link {% if request.resolver_match.url_name == 'overview' %}active{% endif %}"
        >
          Overview
        </a>
        <a
          href="{% url 'dashboard:guild_settings_list' %}"
          class="nav-link {% if request.resolver_match.url_name == 'guild_settings_list' %}active{% endif %}"
        >
          Inactivity & core settings
        </a>
        <a href="#" class="nav-link disabled">
          AFK system (coming soon)
        </a>
        <a href="#" class="nav-link disabled">
          Quiet channels (coming soon)
        </a>
        <a href="#" class="nav-link disabled">
          Logs & history (coming soon)
        </a>
      </nav>

      <div class="mt-auto small text-muted">
        Logged in as <strong>{{ request.user.username }}</strong><br>
        <a href="/admin/logout/" class="link-light text-decoration-none">Log out</a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="col py-4 px-4 px-lg-5">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

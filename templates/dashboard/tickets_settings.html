{% extends "dashboard/base.html" %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="h3 mb-1">Tickets</h1>
    <p class="text-muted mb-0">Configure ticket panel + routing + exemption workflow.</p>
  </div>
</div>

<div class="card card-panel">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}

      <div class="form-check form-switch mb-4">
        <input class="form-check-input" type="checkbox" name="tickets_enabled" id="tickets_enabled"
          {% if gs.tickets_enabled %}checked{% endif %}>
        <label class="form-check-label" for="tickets_enabled">Enable ticket system</label>
      </div>

      <h5 class="mb-3">Ticket Panel</h5>

      <div class="mb-3">
        <label class="form-label">Panel Channel ID</label>
        <input class="form-control" name="ticket_panel_channel_id" value="{{ gs.ticket_panel_channel_id|default:'' }}">
        <div class="form-text">Channel where you’ll post the “Create Ticket” panel.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Panel Title</label>
        <input class="form-control" name="ticket_panel_title" value="{{ gs.ticket_panel_title }}">
      </div>

      <div class="mb-4">
        <label class="form-label">Panel Description</label>
        <textarea class="form-control" rows="4" name="ticket_panel_description">{{ gs.ticket_panel_description }}</textarea>
      </div>

      <hr class="my-4">

      <h5 class="mb-3">Ticket Routing</h5>

      <div class="mb-3">
        <label class="form-label">Staff Role ID</label>
        <input class="form-control" name="staff_role_id" value="{{ gs.staff_role_id|default:'' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Support Category ID</label>
        <input class="form-control" name="support_category_id" value="{{ gs.support_category_id|default:'' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Bug Reports Channel ID</label>
        <input class="form-control" name="bug_reports_channel_id" value="{{ gs.bug_reports_channel_id|default:'' }}">
      </div>

      <div class="mb-4">
        <label class="form-label">AFK Approval Channel ID</label>
        <input class="form-control" name="afk_approval_channel_id" value="{{ gs.afk_approval_channel_id|default:'' }}">
      </div>

      <button class="btn btn-primary">Save Settings</button>
    </form>
  </div>
</div>

{% endblock %}
